name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Show build versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Install Hindi OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng fonts-noto-core
          python3 -m pip install --user -r tools/requirements-ocr.txt

      - name: OCR bundled voter PDFs
        run: |
          python3 tools/ocr_voter_pdfs.py
          mkdir -p app/src/main/assets
          cp ocr-output/voters.json app/src/main/assets/voters.json
          python3 -c "import json; d=json.load(open('ocr-output/voters.json', encoding='utf-8')); print('PDFs:', len(d.get('source_pdfs', [])), 'records:', d.get('count', 0)); assert len(d.get('source_pdfs', [])) == 7, 'Expected all seven voter-list PDFs'; assert d.get('count', 0) > 0, 'OCR produced no voter records'"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voter-slip-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
